$kind: http-request
name: POST /api/projects/invite
description: Invite a user to a project by email.
url: "{{baseUrl}}/api/projects/invite"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "projectId": 1,
        "email": "invitee@example.com"
    }
order: 8000
