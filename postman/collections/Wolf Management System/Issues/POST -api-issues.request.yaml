$kind: http-request
name: POST /api/issues
description: "Create a new issue. Status can be: Open, In Progress, Closed.
  Priority can be: Low, Medium, High."
url: "{{baseUrl}}/api/issues"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "title": "New Issue",
        "description": "Issue description",
        "status": "Open",
        "projectId": 1,
        "priority": "Medium",
        "dueDate": "2025-12-31"
    }
order: 3000
