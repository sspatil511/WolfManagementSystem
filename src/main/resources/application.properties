spring.application.name=wolf-management-system

server.port=5454


spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/wfs?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=soham
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
stripe.api.key=${STRIPE_API_KEY:}
stripe.default.price.id=${STRIPE_DEFAULT_PRICE_ID}