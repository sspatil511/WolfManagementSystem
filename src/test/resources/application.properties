# Use in-memory H2 instead of MySQL
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Prevent schema/data auto-init
spring.sql.init.mode=never

# Dummy mail value (just to satisfy placeholder)
spring.mail.password=test

# Stripe test configuration (dummy values for testing)
stripe.publishable.key=pk_test_dummy_key
stripe.api.key=sk_test_dummy_key
stripe.default.price.id=price_test_dummy_id
